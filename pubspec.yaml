name: aiper
description: "AI-Powered Crisis Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  firebase_storage: ^12.4.10
  path: ^1.8.3
  # Updated Firebase for Windows Compatibility
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.4.1
  firebase_messaging: ^15.2.10

  google_maps_flutter: ^2.10.0

  # AI & Others
  google_generative_ai: ^0.4.7
  mqtt_client: ^10.3.0
  audioplayers: ^5.2.1
  vibration: ^2.0.0

  # Map Packages
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI / Helpers
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  geolocator: ^13.0.0
  package_info_plus: ^9.0.0
  flutter_map_cancellable_tile_provider: ^2.0.0
  share_plus: ^12.0.1
  csv: ^6.0.0
  geocoding: ^3.0.0
  excel: ^4.0.6
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^20.0.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  provider: ^6.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/sirens.gif
    - assets/sounds/sirens.mp3
